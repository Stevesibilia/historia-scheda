name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install reportlab

      - name: Check VERSION matches tag
        run: |
          version=$(python -c "from scheda_v3 import VERSION; print(VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::VERSION in scheda_v3.py is $version but tag is $tag"
            exit 1
          fi
          echo "PDF=output/scheda_personaggio_v${version}.pdf" >> "$GITHUB_ENV"

      - name: Build sheet
        run: python scheda_v3.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PDF" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PDF" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
